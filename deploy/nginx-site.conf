# Company landing page on aidolab.mn; www redirects to the apex.
# Only the public pages are served here. Everything else (login, dashboard, admin,
# OAuth callbacks) redirects to app.aidolab.mn, so sessions and OAuth stay on one host.
# TLS: certificate "aidolab.mn-site" (aidolab.mn + www) from certbot-dns-route53 (bootstrap-hosting.sh).
server {
    listen 80;
    listen [::]:80;
    server_name aidolab.mn www.aidolab.mn;
    return 301 https://aidolab.mn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aidolab.mn;
    ssl_certificate     /etc/letsencrypt/live/aidolab.mn-site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidolab.mn-site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://aidolab.mn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aidolab.mn;
    ssl_certificate     /etc/letsencrypt/live/aidolab.mn-site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidolab.mn-site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;

    location /static/ {
        alias /srv/aidolab/app/staticfiles/;
        expires 7d;
    }

    # Landing (/), service pages, contact form, privacy policy, terms.
    location ~ ^/(|uilchilgee/[a-z0-9-]+/|contact/|privacy/|terms/)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://app.aidolab.mn$request_uri;
    }
}
