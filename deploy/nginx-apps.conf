# Student apps: <slug>.aidolab.mn → <slug>.apps.aidolab.internal:8000 (ECS task, Cloud Map DNS).
# No per-app config: the slug from the hostname picks the upstream. Installed only with HOSTING_BACKEND=aws.
# TLS: wildcard certificate *.aidolab.mn from certbot-dns-route53 (bootstrap-hosting.sh).
# Custom domains: one generated server block each in /etc/nginx/aidolab-domains/ (sync-domains.py).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Any other host on port 80 (customer domains): Let's Encrypt HTTP-01 challenges, otherwise HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name "~^(?<app>[a-z0-9][a-z0-9-]{1,38}[a-z0-9])\.aidolab\.mn$";
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;  # nginx 1.24 (Ubuntu 24.04) syntax
    listen [::]:443 ssl http2;
    server_name "~^(?<app>[a-z0-9][a-z0-9-]{1,38}[a-z0-9])\.aidolab\.mn$";

    ssl_certificate     /etc/letsencrypt/live/aidolab.mn-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aidolab.mn-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/aidolab-app-proxy.conf;
}

include /etc/nginx/aidolab-domains/*.conf;
