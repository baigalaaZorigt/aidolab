# Dashboard. certbot (--nginx) adds the 443/TLS block and the HTTP→HTTPS redirect
# to this file once app.aidolab.mn points at this server's Elastic IP.
server {
    listen 80;
    listen [::]:80;
    server_name app.aidolab.mn;

    client_max_body_size 5m;

    location /static/ {
        alias /srv/aidolab/app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Scans can take a few minutes (matches gunicorn --timeout 180).
        proxy_read_timeout 180s;
    }
}
# Student apps (*.aidolab.mn) and custom domains are added when real hosting starts
# (wildcard cert via certbot-dns-route53) — see HOSTING_PLAN.md 3б.
