# Proxy to one student app; the including server block sets $app to the app slug.
# Used by nginx-apps.conf (*.aidolab.mn) and the custom-domain blocks from sync-domains.py.
client_max_body_size 20m;

# VPC DNS (base of the VPC CIDR + 2) resolves Cloud Map names; short TTL follows task restarts.
resolver 10.40.0.2 valid=10s ipv6=off;
resolver_timeout 3s;

location / {
    proxy_pass http://$app.apps.aidolab.internal:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # WebSockets (Streamlit, live dashboards)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @down;
}

location @down {
    default_type text/html;
    return 503 '<!doctype html><meta charset="utf-8"><title>aidolab</title><body style="font-family:sans-serif;padding:40px"><h1>Апп ажиллахгүй байна</h1><p>Апп унтарсан, deploy хийгдэж байгаа эсвэл алдаа гарсан байна. Dashboard-оос шалгана уу: <a href="https://app.aidolab.mn">app.aidolab.mn</a></p>';
}
