# Runs in a throwaway CodeBuild machine. Inputs (env): REPO_URL, IMAGE_TAG, ECR_REPO,
# COMMIT (the scanned commit; empty = default branch), DOCKERFILE_B64 (from checker/buildplan.py),
# GITHUB_TOKEN (private repos only: 1-hour read-only GitHub App token, used for the fetch and then unset).
# The repo's own Dockerfile wins; otherwise the generated one is used. All detection lives in buildplan.py.
version: 0.2
phases:
  pre_build:
    commands:
      - echo "==> Repo татаж байна $REPO_URL $COMMIT"
      - |
        set -e
        if [ -n "$GITHUB_TOKEN" ]; then
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $AUTH"
        fi
        if [ -n "$COMMIT" ]; then
          git init -q app && git -C app config core.symlinks false
          git -C app fetch -q --depth 1 "$REPO_URL" "$COMMIT"
          git -C app checkout -q FETCH_HEAD
        else
          git -c core.symlinks=false clone --depth 1 "$REPO_URL" app
        fi
        unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
        rm -rf app/.git  # never copied into an image (a static site would serve it)
      - unset GITHUB_TOKEN AUTH
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
  build:
    commands:
      - cd app
      - |
        if [ -f Dockerfile ]; then
          echo "==> Repo-гийн Dockerfile ашиглана"
        elif [ -n "$DOCKERFILE_B64" ]; then
          echo "$DOCKERFILE_B64" | base64 -d > Dockerfile
          echo "==> Dockerfile үүсгэлээ:"; sed 's/^/    /' Dockerfile
        else
          echo "!! Апп-ыг яаж эхлүүлэхийг олсонгүй. Procfile-д 'web: ...' мөр нэмнэ үү."; exit 1
        fi
      - echo "==> Image бүтээж байна $IMAGE_TAG"
      - docker build -t "$ECR_REPO:$IMAGE_TAG" .
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - docker push "$ECR_REPO:$IMAGE_TAG"
      - echo "==> Image бэлэн"
