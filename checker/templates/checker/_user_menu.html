<div class="who"><b>{{ user.first_name|default:user.username }}</b><span>{{ user.email|default:user.username }}</span></div>
<a href="/account/"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Бүртгэл</a>
{% if user.is_staff %}<a href="/admin/"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/></svg>Багшийн самбар</a>{% endif %}
<form method="post" action="/logout/">{% csrf_token %}
  <button type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Гарах</button>
</form>
